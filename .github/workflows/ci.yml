name: FinLife CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate foundation
        run: |
          test -f README.md
          test -f api/health.js
          test -f supabase/migrations/0001_finlife_core.sql
          test -f apps/mobile/app.json
